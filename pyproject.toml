[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fortuneo-sidecar"
version = "0.2.0"
description = "Unofficial Fortuneo CLI: accounts, transactions and investment positions as JSON."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE", "LICENSES/*"]
requires-python = ">=3.11"
authors = [{ name = "Romain Dujardin" }]
keywords = ["fortuneo", "banking", "cli", "woob", "json", "finance"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
]
dependencies = [
  "woob==3.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "build>=1.2",
  "twine>=5",
]

[project.scripts]
fortuneo-sidecar = "fortuneo_sidecar.cli:main"
fortuneo-cli = "fortuneo_sidecar.cli:main"

[project.urls]
Homepage = "https://github.com/Romaindujardin/fortuneo-cli"
Repository = "https://github.com/Romaindujardin/fortuneo-cli"
Issues = "https://github.com/Romaindujardin/fortuneo-cli/issues"
Changelog = "https://github.com/Romaindujardin/fortuneo-cli/blob/main/CHANGELOG.md"
Security = "https://github.com/Romaindujardin/fortuneo-cli/security/policy"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["fortuneo_sidecar*"]

[tool.setuptools.package-data]
"fortuneo_sidecar.vendor" = [
  "woob_modules/**/*.py",
  "woob_modules/**/*.txt",
  "woob_modules/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "network: tests hitting a real network endpoint (disabled by default)",
  "real: tests using real Fortuneo credentials (disabled by default)",
]
